<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><title>Órbita — Sistema Solar</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#101010;--line:#292929;--muted:#a1a1a1;--text:#f2f2f2;--accent:#8bd5ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;min-height:100svh}main{width:min(1160px,100%);height:100svh;min-height:0;margin:auto;padding:clamp(10px,2vw,22px);display:flex;flex-direction:column;overflow:hidden}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:10px}h1{font-size:clamp(1.65rem,4vw,2.4rem);line-height:1.1;letter-spacing:-.04em;margin:6px 0 8px}.eyebrow{color:var(--accent);font-size:.73rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}header p{color:var(--muted);margin:0}.stamp{color:var(--muted);font-size:.8rem;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);grid-template-rows:minmax(0,1fr);gap:12px;flex:1;min-height:0;align-items:stretch}.panel{background:#101010;border:1px solid #292929;border-radius:14px}.sky{padding:12px;min-width:0;min-height:0;display:flex;flex-direction:column}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 4px 8px}.panel-head strong{font-size:.95rem}.badge{border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.72rem;padding:4px 9px}.diagram{width:100%;display:block;flex:1;height:auto;min-height:0;aspect-ratio:auto;max-height:none;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.orbit{fill:none;stroke:#303030;stroke-width:1}.sun-glow{fill:#ffc45c;opacity:.13}.sun{fill:#ffd06a}.planet{stroke:#050505;stroke-width:2}.legend{display:flex;gap:8px 15px;flex-wrap:wrap;padding:12px 4px 0;color:var(--muted);font-size:.75rem}.legend span{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%}.side{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}.side h2{font-size:1rem;margin:0}.sub{color:var(--muted);font-size:.8rem;margin:-12px 0 0}.rows{display:grid;gap:2px;min-height:0}.row{display:grid;grid-template-columns:minmax(95px,1fr) auto;gap:12px;align-items:center;padding:3px 4px;line-height:1.2}.who{display:flex;align-items:center;gap:9px;font-weight:550}.row small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;line-height:1.2}.value{text-align:right;font-variant-numeric:tabular-nums;font-size:.86rem;line-height:1.2}.controls{display:flex;gap:9px;align-items:center;padding-top:10px}.controls label{font-size:.77rem;color:var(--muted)}input{min-width:0;flex:1;background:#080808;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;font-size:.8rem}button{border:0;border-radius:9px;background:var(--accent);color:#0b1720;font-family:inherit;font-size:.82rem;font-weight:700;padding:9px 12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.58;cursor:wait}.status{height:3.2em;min-height:3.2em;overflow:hidden;display:flex;align-items:flex-start;gap:7px;color:var(--muted);font-size:.78rem}.spinner{display:none;width:12px;height:12px;flex:0 0 12px;margin-top:2px;border:2px solid #414141;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.status.loading .spinner{display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}.status.error{color:#ff9d9d}.foot{margin:10px 2px 0;color:#949494;font-size:.72rem}.foot a{color:#b6c7dd}.key{fill:#75839a;font:10px ui-monospace,Consolas,monospace}.tip{fill:#999999;font:9px ui-monospace,Consolas,monospace}@media(max-width:760px){main{height:auto;min-height:100svh;overflow:visible;padding:20px 14px}header{align-items:flex-start;flex-direction:column;gap:10px}.layout{grid-template-columns:1fr}.diagram{height:42vh;min-height:240px;max-height:none}.side{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.spinner{animation:none;border-top-color:#414141}}
</style></head>
<body><main>
<header><div><h1>Sistema Solar</h1><p id="date-description">Posición de los planetas el día.</p></div><div class="stamp" id="clock">Calculando…</div></header>
<section class="layout"><article class="panel sky">
<svg id="map" class="diagram" viewBox="0 0 600 500" role="img" aria-label="Diagrama superior de las órbitas planetarias alrededor del Sol"><g id="orbits"></g><g id="marks"></g><circle cx="300" cy="250" r="24" class="sun-glow"/><circle cx="300" cy="250" r="12" class="sun"/><text x="300" y="276" text-anchor="middle" class="tip">Sol</text></svg><div id="legend" class="legend"></div></article>
<aside class="panel side"><h2>Posiciones actuales</h2><p class="sub">Longitud media respecto al Sol</p><div class="rows" id="rows"></div><div class="controls"><label for="date">Fecha</label><input id="date" type="date"><button id="refresh">Actualizar</button></div><div class="status" id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-message">Preparando consulta…</span></div></aside></section>
<p class="foot">Datos: <a href="https://ssp.imcce.fr/webservices/vos4o/" target="_blank" rel="noreferrer">VOS⁴O · IMCCE</a>. Las posiciones son longitudes heliocéntricas medias; el dibujo representa los ocho planetas y no muestra sus distancias a escala.</p>
</main>
<script>
const bodies=[
 {id:'mercury',name:'Mercurio',a:.39,diameter:4879,color:'#b6a494'},{id:'venus',name:'Venus',a:.72,diameter:12104,color:'#edbd83'},{id:'earth',name:'Tierra',a:1,diameter:12742,color:'#68a9ff'},{id:'mars',name:'Marte',a:1.52,diameter:6779,color:'#f07862'},{id:'jupiter',name:'Júpiter',a:5.20,diameter:139820,color:'#e7ad76'},{id:'saturn',name:'Saturno',a:9.58,diameter:116460,color:'#e8d29a'},{id:'uranus',name:'Urano',a:19.2,diameter:50724,color:'#79d8d5'},{id:'neptune',name:'Neptuno',a:30.1,diameter:49244,color:'#799aff'}];
const byId=Object.fromEntries(bodies.map(b=>[b.id,b]));const known=new Map();const $=s=>document.querySelector(s);const NS='http://www.w3.org/2000/svg';
function updateClock(date){$('#clock').textContent=new Intl.DateTimeFormat('es-AR',{dateStyle:'full',timeStyle:'short',timeZone:'UTC'}).format(date)+' UTC'}
function localDateValue(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function updateDateDescription(value){if(!value)return;const [y,m,d]=value.split('-').map(Number);const date=new Date(y,m-1,d,12);const label=new Intl.DateTimeFormat('es-AR',{dateStyle:'long'}).format(date);$('#date-description').textContent=`Posición de los planetas el día ${label}.`}
function draw(){const orbits=$('#orbits'),marks=$('#marks');orbits.replaceChildren();marks.replaceChildren();const cx=300,cy=250,scale=29;for(const b of bodies){const r=28+Math.sqrt(b.a)*scale;const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);c.setAttribute('class','orbit');orbits.append(c);const deg=known.get(b.id)?.angle??(bodies.indexOf(b)*43+15),rad=(deg-90)*Math.PI/180,x=cx+r*Math.cos(rad),y=cy+r*Math.sin(rad);const dot=document.createElementNS(NS,'circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',Math.max(4.2,6+1.5*Math.log(b.diameter/12742)));dot.setAttribute('fill',b.color);dot.setAttribute('class','planet');marks.append(dot);const label=document.createElementNS(NS,'text');label.setAttribute('x',x+10);label.setAttribute('y',y+3);label.setAttribute('fill',b.color);label.setAttribute('font-size','11');label.textContent=b.name;marks.append(label)}$('#rows').innerHTML=bodies.map(b=>{const p=known.get(b.id);return `<div class="row"><div class="who"><i class="dot" style="background:${b.color}"></i>${b.name}</div><div class="value">${p?`${p.angle.toFixed(1)}°<small>${p.distance!=null?p.distance.toFixed(2)+' UA desde el Sol':'longitud heliocéntrica'}</small>`:'<span style="color:#91a0b8">—<small>Esperando datos</small></span>'}</div></div>`}).join('');$('#legend').innerHTML=bodies.map(b=>`<span><i class="dot" style="background:${b.color}"></i>${b.name}</span>`).join('')}
function parse(text){const lines=text.split(/\r?\n/).filter(Boolean);const out=new Map();const headerLine=lines.findIndex(line=>/longitude/i.test(line));const delimiter=headerLine>=0?(lines[headerLine].includes(';')?';':','):',';const headers=headerLine>=0?lines[headerLine].split(delimiter).map(x=>x.toLowerCase()):[];const angleCol=headers.findIndex(x=>/longitude|longitud/i.test(x));const distanceCol=headers.findIndex(x=>/distance|distanc/i.test(x));for(let i=Math.max(0,headerLine+1);i<lines.length;i++){const cols=lines[i].split(delimiter).map(x=>x.trim().replace(/^"|"$/g,''));const lower=cols.join(' ').toLowerCase();const b=bodies.find(x=>new RegExp(`\\b${x.id}\\b`).test(lower));if(!b)continue;const vals=cols.map(x=>Number(x.replace(',','.')));let angle=angleCol>=0?vals[angleCol]:undefined;let distance=distanceCol>=0?vals[distanceCol]:undefined;if(!Number.isFinite(angle)){const nums=vals.filter(Number.isFinite);angle=nums.at(-1)}if(Number.isFinite(angle)&&angle>=0&&angle<=360)out.set(b.id,{angle,distance:Number.isFinite(distance)?distance:undefined})}return out}
async function load(){const date=$('#date').value||localDateValue(),stamp=new Date(date+'T12:00:00Z');const status=$('#status');status.className='status loading';$('#status-message').textContent='Consultando posiciones…';$('#refresh').disabled=true;try{const u=new URL('https://ssp.imcce.fr/webservices/vos4o/scale.php');u.search=new URLSearchParams({'-scale':'1:1','-unit':'au','-lang':'en-us','-mime':'text/csv','-date':date.replaceAll('-',':')+' 12:00:00'});const res=await fetch(u,{headers:{Accept:'text/csv'}});if(!res.ok)throw Error('El servicio respondió '+res.status);const raw=await res.text();const found=parse(raw);if(found.size<5)throw Error('El formato recibido no permitió leer las posiciones.');known.clear();for(const [k,v] of found)known.set(k,v);draw();updateClock(stamp);updateDateDescription(date);status.className='status';$('#status-message').textContent=`Datos actualizados para el ${date}. Longitudes heliocéntricas medias del servicio IMCCE.`}catch(e){draw();status.className='status error';$('#status-message').textContent='No se pudo leer la API desde este navegador. Revisa la conexión o abre el servicio IMCCE.'}finally{$('#refresh').disabled=false}}
$('#date').value=localDateValue();updateDateDescription($('#date').value);$('#refresh').addEventListener('click',load);draw();load();
</script></body></html>
